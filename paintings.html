<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Paintings | Art by Justyna</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="icon-512x512.png" type="image/png">
</head>
<body class="paintings-page">
    <header>
        <div class="nav-wrapper">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="paintings.html">Paintings</a></li>
                    <li><a href="instagram.html">Instagram</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="page-shell">
        <section class="paintings">
            <div class="section-heading">
                <p class="eyebrow">Gallery</p>
                <h1>My Paintings</h1>
                <p class="lede">Tap any piece to open a glassy lightbox with zoom.</p>
            </div>
            <div class="images">
                <div class="painting-card" data-title="Cesta za cilem" data-material="Akryl">
                    <img src="images/1.jpg" alt="Cesta za cilem">
                </div>
                <div class="painting-card" data-title="Boure" data-material="Akryl">
                    <img src="images/2.jpg" alt="Boure">
                </div>
                <div class="painting-card" data-title="Dvoji zivot" data-material="Akryl">
                    <img src="images/3.jpg" alt="Dvoji zivot">
                </div>
                <div class="painting-card" data-title="Samota" data-material="Akryl">
                    <img src="images/4.jpg" alt="Samota">
                </div>
                <div class="painting-card" data-title="Svetlo domova" data-material="Akryl">
                    <img src="images/5.jpg" alt="Svetlo domova">
                </div>
                <div class="painting-card" data-title="Zapad" data-material="Akryl 2D sadra">
                    <img src="images/6.jpg" alt="Zapad">
                </div>
                <div class="painting-card" data-title="Delta" data-material="Akryl">
                    <img src="images/7.jpg" alt="Delta">
                </div>
                <div class="painting-card" data-title="Cesta k tichu" data-material="Akryl">
                    <img src="images/8.jpg" alt="Cesta k tichu">
                </div>
                <div class="painting-card" data-title="Na okraji" data-material="Akryl">
                    <img src="images/9.jpg" alt="Na okraji">
                </div>
                <div class="painting-card" data-title="Chlad" data-material="Akryl">
                    <img src="images/10.jpg" alt="Chlad">
                </div>
                <div class="painting-card" data-title="Radost" data-material="Akryl">
                    <img src="images/16.jpg" alt="Radost">
                </div>
                <div class="painting-card" data-title="Zrcadlo" data-material="Akryl">
                    <img src="images/11.jpg" alt="Zrcadlo">
                </div>
                <div class="painting-card" data-title="Utes" data-material="Akryl">
                    <img src="images/12.jpg" alt="Utes">
                </div>
                <div class="painting-card" data-title="Dovolena" data-material="Akryl">
                    <img src="images/13.jpg" alt="Dovolena">
                </div>
                <div class="painting-card" data-title="Odraz" data-material="Akryl">
                    <img src="images/14.jpg" alt="Odraz">
                </div>
                <div class="painting-card" data-title="Budoucnost" data-material="Akryl">
                    <img src="images/15.jpg" alt="Budoucnost">
                </div>
            </div>
            <p class="disclaimer">Disclaimer: paintings are not framed.</p>
        </section>
    </main>

    <dialog id="myModal" class="modal" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button class="close" type="button" aria-label="Close painting">&times;</button>
            <img id="modalImage" alt="Expanded Image">
            <div id="modalInfo" class="caption">
                <span id="modalTitle"></span>
                <span id="modalMaterial" class="material"></span>
            </div>
            <div class="zoom-lens"></div>
        </div>
    </dialog>

    <script src="js/script.js"></script>

    <footer class="site-footer">
        <p><a href="about.html#privacy">Website privacy</a></p>
        <a href="https://majkey25.github.io/init/" class="footer-link">
            <p>Website by Matěj Teplý · <span id="year"></span></p>
        </a>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
